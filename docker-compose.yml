name: skladna

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skladna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skladna}
      POSTGRES_DB: ${POSTGRES_DB:-skladna}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skladna} -d ${POSTGRES_DB:-skladna}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skladna}:${POSTGRES_PASSWORD:-skladna}@db:5432/${POSTGRES_DB:-skladna}
      REDIS_URL: redis://redis:6379/0
      PAYMENT_API_URL: ${PAYMENT_API_URL:-http://payments.local}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:

