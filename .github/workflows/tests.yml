name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The reference run: one process, fixed order. If this is red, something is
  # genuinely broken; the jobs below only add confidence.
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke tests
        run: pytest -m smoke

      - name: Full run with coverage
        run: |
          pytest --junitxml=reports/junit.xml \
                 --cov=app --cov-report=term-missing \
                 --alluredir=allure-results

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore

      - name: Build the Allure report
        if: always()
        run: |
          curl -sSL -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
          tar -zxf allure.tgz
          ./allure-2.30.0/bin/allure generate allure-results --clean -o allure-report

      - name: Upload the Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.python-version }}
          path: allure-report/
          if-no-files-found: ignore

  # Parallel and randomised. Two things are checked here that the run above
  # cannot check: that no test depends on the order, and that no test leaks
  # state into another when they share the machine.
  order-independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Random order, five times
        run: |
          for run in 1 2 3 4 5; do
            echo "::group::random run $run"
            pytest -q --random-order
            echo "::endgroup::"
          done

      - name: Parallel on four workers
        run: pytest -q -n 4

