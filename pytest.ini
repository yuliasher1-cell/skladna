[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers --strict-config
markers =
    smoke: fast liveness checks of the API, run in CI on every commit
    regression: detailed business-logic checks
    slow: long-running tests, excluded from the fast run
    bug: the test documents a known defect (xfail)
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`:Warning

