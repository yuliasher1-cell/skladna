[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers --strict-config
markers =
    smoke: быстрые проверки живости API, идут в CI на каждый коммит
    regression: подробные проверки бизнес-логики
    slow: длинные тесты, в быстрый прогон не входят
    bug: тест документирует известный дефект (xfail)
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`:Warning

